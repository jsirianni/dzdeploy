name: release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Require a stable version tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH without leading zeros or suffixes.' >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          install-only: true
      - run: goreleaser check
      - name: Build portable archives and Linux packages without publishing
        run: goreleaser release --snapshot --clean
      - name: Verify archive checksums
        working-directory: .tools/releases
        run: sha256sum --check checksums.txt
      - name: Smoke-test the Linux client
        run: |
          mkdir -p .tools/release-smoke
          unzip .tools/releases/dzdeploy_*_linux_amd64.zip -d .tools/release-smoke
          test -s .tools/release-smoke/agents/windows-amd64/dzdeploy.exe
          .tools/release-smoke/dzdeploy --help
          .tools/release-smoke/dzdeploy version

      - name: Verify asset set
        shell: bash
        run: |
          test "$(find .tools/releases -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          test "$(find .tools/releases -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          test "$(find .tools/releases -maxdepth 1 -name '*.rpm' | wc -l)" -eq 2
          test "$(wc -l < .tools/releases/checksums.txt)" -eq 8
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-tests
          path: |
            .tools/releases/*.zip
            .tools/releases/*.deb
            .tools/releases/*.rpm
            .tools/releases/checksums.txt
            .tools/releases/linux_amd64/dzdeploy
            .tools/releases/linux_arm64/dzdeploy
            .tools/releases/windows_amd64/dzdeploy.exe
          if-no-files-found: error
          retention-days: 7

  package-integration:
    name: Linux packages / ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@v4
        with:
          name: release-package-tests
          path: .tools/releases
      - name: Restore executable modes and verify checksums
        run: |
          chmod +x .tools/releases/linux_*/dzdeploy
          cd .tools/releases
          sha256sum --check checksums.txt
      - name: Test Debian, Ubuntu and AlmaLinux without client network access
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/package-integration.sh
          for distro in debian:12-slim ubuntu:24.04 almalinux:9; do
            format=deb
            [[ "$distro" != almalinux:* ]] || format=rpm
            docker build --build-arg "BASE=$distro" -f scripts/linux-package.Dockerfile -t dzdeploy-package-test scripts
            docker run --rm --network none -v "$PWD/.tools/releases:/packages:ro" dzdeploy-package-test "$format"
          done

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, package-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Publish GitHub Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
