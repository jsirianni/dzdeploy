version: 2
project_name: dzdeploy
dist: .tools/releases

builds:
  - id: dzdeploy
    main: ./cmd/dzdeploy
    # Stable, distinct staging paths let every archive reuse the amd64 host agent.
    binary: '{{ .Os }}_{{ .Arch }}/dzdeploy'
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w

archives:
  - id: portable
    ids: [dzdeploy]
    formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    strip_binary_directory: true
    # Only these tracked public assets and the freshly built agent are packaged.
    files:
      - src: .tools/releases/windows_amd64/dzdeploy.exe
        dst: agents/windows-amd64
        strip_parent: true
        info:
          mode: 0755
      - src: scripts/bootstrap-windows.ps1
        strip_parent: true
      - deploy.example.yaml
      - src: docs/deployment.md
        strip_parent: true
      - src: docs/operator-workflows.md
        strip_parent: true

nfpms:
  - id: linux
    ids: [dzdeploy]
    package_name: dzdeploy
    file_name_template: '{{ .ConventionalFileName }}'
    homepage: https://github.com/jsirianni/dzdeploy
    maintainer: jsirianni <23043836+jsirianni@users.noreply.github.com>
    description: DayZ configuration deployment client for Windows hosts over SSH/SFTP.
    formats: [deb, rpm]
    dependencies: [git, ca-certificates]
    # Artifact names include linux_<arch>/; keep the companion next to the real
    # executable. /usr/bin exposes a symlink, resolved by Go's os.Executable.
    bindir: /usr/lib/dzdeploy
    contents:
      # Claim package-specific directories so RPM removal cleans them up.
      - dst: /usr/lib/dzdeploy
        type: dir
      - dst: '/usr/lib/dzdeploy/linux_{{ .Arch }}'
        type: dir
      - dst: '/usr/lib/dzdeploy/linux_{{ .Arch }}/agents'
        type: dir
      - dst: '/usr/lib/dzdeploy/linux_{{ .Arch }}/agents/windows-amd64'
        type: dir
      - dst: /usr/share/dzdeploy
        type: dir
      - dst: /usr/share/doc/dzdeploy
        type: dir
      - src: '/usr/lib/dzdeploy/linux_{{ .Arch }}/dzdeploy'
        dst: /usr/bin/dzdeploy
        type: symlink
      - src: .tools/releases/windows_amd64/dzdeploy.exe
        dst: '/usr/lib/dzdeploy/linux_{{ .Arch }}/agents/windows-amd64/dzdeploy.exe'
        file_info:
          mode: 0755
      - src: scripts/bootstrap-windows.ps1
        dst: /usr/share/dzdeploy/bootstrap-windows.ps1
      - src: deploy.example.yaml
        dst: /usr/share/doc/dzdeploy/deploy.example.yaml
      - src: docs/deployment.md
        dst: /usr/share/doc/dzdeploy/deployment.md
      - src: docs/operator-workflows.md
        dst: /usr/share/doc/dzdeploy/operator-workflows.md

checksum:
  name_template: checksums.txt
  algorithm: sha256
